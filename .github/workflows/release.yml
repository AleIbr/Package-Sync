name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:

    name: Build and release
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Install Java 21
      # ------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ------------------------------------------------------------
      # Get Maven project version
      # ------------------------------------------------------------
      - name: Get project version
        id: project
        shell: bash
        run: |
          VERSION=$(./mvnw help:evaluate \
          -Dexpression=project.version \
          -q \
          -DforceStdout)
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT" 
          echo "Building version $VERSION" 

      # ------------------------------------------------------------
      # Making sure the Git tag matches the Maven version
      # ------------------------------------------------------------
      - name: Verify version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}" 
          POM_VERSION="${{ steps.project.outputs.version }}" 
          
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then 
            echo "Version mismatch!" 
            echo "Git tag: $TAG_VERSION" 
            echo "pom.xml: $POM_VERSION" 
            exit 1 
          fi 

      # ------------------------------------------------------------
      # Build executable/fat JAR
      # ------------------------------------------------------------
      - name: Build JAR
        run: ./mvnw --batch-mode clean package

      # ------------------------------------------------------------
      # Prepare input for jpackage
      # ------------------------------------------------------------
      - name: Prepare jpackage input
        shell: bash
        run: |
          VERSION="${{ steps.project.outputs.version }}"
          
          mkdir -p "target/jpackage-input" 
          
          cp "target/packagesync-${VERSION}.jar" \
             "target/jpackage-input/packagesync-${VERSION}.jar"

      # ------------------------------------------------------------
      # Build Debian package
      # ------------------------------------------------------------
      - name: Build Debian package
        shell: bash
        run: |
          VERSION="${{ steps.project.outputs.version }}" 
          
          mkdir -p "target/dist" 
          
          jpackage \ 
            --type deb \ 
            --name packagesync \ 
            --app-version "$VERSION" \ 
            --vendor "aleibr" \ 
            --description "A CLI tool for synchronizing packages" \ 
            --input "target/jpackage-input" \ 
            --main-jar "packagesync-${VERSION}.jar" \ 
            --main-class "de.aleibr.packagesync.Main" \ 
            --dest "target/dist" 
          
          DEB=$(find target/dist -maxdepth 1 -type f -name '*.deb' -print -quit) 
          
          mkdir -p target/deb-extract 
          mkdir -p target/deb-control 
          
          dpkg-deb -x "$DEB" target/deb-extract 
          dpkg-deb -e "$DEB" target/deb-control 
          
          cat > target/deb-control/postinst <<'EOF'
          #!/bin/sh 
          ln -sf /opt/packagesync/bin/packagesync 
          /usr/bin/packagesync 
          exit 0 
          EOF 
          
          chmod 755 target/deb-control/postinst 
          rm "$DEB" 
          
          dpkg-deb -b \ 
            target/deb-extract \ 
            "target/dist/packagesync_${VERSION}-1_amd64.deb"

      # ------------------------------------------------------------
      # Rename JAR to a simple release filename
      # ------------------------------------------------------------
      - name: Prepare release artifacts
        shell: bash
        run: |
          VERSION="${{ steps.project.outputs.version }}"

          cp target/jpackage-input/*.jar \
          "target/dist/packagesync-${VERSION}.jar"
      
          echo "Release artifacts:"
          ls -lh target/dist

      # ------------------------------------------------------------
      # Create GitHub Release and upload artifacts
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.project.outputs.version }}"

          JAR="target/dist/packagesync-${VERSION}.jar"
          DEB=$(find target/dist -maxdepth 1 -type f -name '*.deb' -print -quit)
      
          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb package found!"
            ls -lah target/dist
            exit 1
          fi
      
          echo "JAR: $JAR"
          echo "DEB: $DEB"
      
          gh release create "$GITHUB_REF_NAME" \
            "$JAR" \
            "$DEB" \
            --title "PackageSync ${VERSION}" \
            --generate-notes